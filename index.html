<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trainer">

<title>Trainer — 12 Week Plan</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: #0a0a0a;
  color: #f2f2f2;
  -webkit-font-smoothing: antialiased;
  font-size: 16px;
  line-height: 1.45;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior-y: contain;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 64px; }
header {
  padding: 16px 20px 8px;
  position: sticky; top: 0;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  z-index: 10;
  border-bottom: 1px solid #1f1f1f;
}
header h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
header .sub { font-size: 13px; color: #888; margin-top: 2px; }

main { flex: 1; padding: 12px 16px 20px; }

nav.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  display: flex;
  background: rgba(15,15,15,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid #1f1f1f;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  z-index: 20;
  max-width: 480px;
  margin: 0 auto;
}
nav.tabbar button {
  flex: 1;
  background: none;
  border: none;
  color: #666;
  font-size: 11px;
  padding: 6px 4px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-family: inherit;
  font-weight: 500;
}
nav.tabbar button.active { color: #f5a623; }
nav.tabbar button .ico {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

.btn {
  background: #1c1c1c;
  color: #f2f2f2;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.btn:active { background: #2a2a2a; }
.btn-primary {
  background: #f5a623;
  color: #0a0a0a;
  border-color: #f5a623;
  font-weight: 600;
}
.btn-primary:active { background: #d88f15; }
.btn-danger { color: #ff6b6b; border-color: #3a1f1f; background: #1a0f0f; }

.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

.card {
  background: #141414;
  border: 1px solid #1f1f1f;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
  transition: background 0.15s;
}
.card.tappable { cursor: pointer; }
.card.tappable:active { background: #1a1a1a; }
.card .row-title { font-size: 16px; font-weight: 600; }
.card .row-meta { font-size: 13px; color: #888; margin-top: 3px; }

.week-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.week-chip {
  background: #1c1c1c;
  border: 1px solid #2a2a2a;
  border-radius: 10px;
  padding: 10px 4px;
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  color: #aaa;
  font-weight: 500;
}
.week-chip.active {
  background: #f5a623;
  color: #0a0a0a;
  border-color: #f5a623;
  font-weight: 700;
}
.week-chip .num { display: block; font-size: 16px; font-weight: 700; margin-bottom: 1px; }
.week-chip.done::after {
  content: "•";
  color: #4ade80;
  font-size: 18px;
  line-height: 0;
  margin-left: 3px;
}
.week-chip.active.done::after { color: #0a0a0a; }

.day-card { display: flex; align-items: center; gap: 12px; }
.day-card .day-badge {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: #1f1f1f;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
  flex-shrink: 0;
  color: #ccc;
}
.day-card.done .day-badge {
  background: #1f3a1f; color: #4ade80;
}
.day-card.rest .day-badge {
  background: #2a2014; color: #f5a623;
}
.day-card .day-info { flex: 1; min-width: 0; }
.day-card .day-info .t { font-size: 15px; font-weight: 600; }
.day-card .day-info .m { font-size: 12px; color: #888; margin-top: 2px; }
.day-card .chev { color: #555; font-size: 18px; }

.exercise-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px;
  background: #141414;
  border: 1px solid #1f1f1f;
  border-radius: 12px;
  margin-bottom: 8px;
}
.exercise-row.done { opacity: 0.55; }
.exercise-row.done .ex-title { text-decoration: line-through; }
.checkbox {
  width: 26px; height: 26px;
  border-radius: 50%;
  border: 2px solid #3a3a3a;
  flex-shrink: 0;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  margin-top: 2px;
  transition: all 0.15s;
}
.checkbox.checked { background: #f5a623; border-color: #f5a623; }
.checkbox.checked::after {
  content: "";
  width: 7px; height: 12px;
  border: solid #0a0a0a;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
  margin-bottom: 2px;
}
.exercise-row .ex-body { flex: 1; min-width: 0; }
.ex-title { font-size: 15px; font-weight: 600; line-height: 1.3; }
.ex-line { font-size: 13px; color: #999; margin-top: 4px; line-height: 1.4; }

.section-title {
  font-size: 12px; color: #888;
  text-transform: uppercase; letter-spacing: 0.06em;
  margin: 18px 4px 8px;
  font-weight: 600;
}

.progress-bar {
  height: 4px; background: #1f1f1f; border-radius: 2px;
  overflow: hidden; margin: 14px 0;
}
.progress-bar > div {
  height: 100%; background: #f5a623;
  transition: width 0.3s;
}
.progress-text { font-size: 13px; color: #888; display: flex; justify-content: space-between; }

.muscle-group { margin-bottom: 18px; }
.muscle-name { font-size: 13px; font-weight: 600; color: #f5a623; margin: 0 4px 6px; text-transform: uppercase; letter-spacing: 0.04em;}
.muscle-list { background: #141414; border: 1px solid #1f1f1f; border-radius: 12px; }
.muscle-list .ex-item {
  padding: 12px 14px;
  border-bottom: 1px solid #1f1f1f;
  font-size: 14px;
}
.muscle-list .ex-item:last-child { border-bottom: none; }
.ex-item {
  display: flex;
  align-items: center;
  gap: 10px;
}
.ex-item .ex-name { flex: 1; }
.video-btn {
  flex-shrink: 0;
  border: 1px solid #3a2d17;
  border-radius: 8px;
  background: #241b0d;
  color: #f5a623;
  padding: 6px 9px;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}
.video-btn:active { background: #3a2a12; }
.video-modal {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.86);
}
.video-modal[hidden] { display: none; }
.video-dialog {
  width: min(100%, 640px);
  background: #141414;
  border: 1px solid #2a2a2a;
  border-radius: 14px;
  padding: 14px;
}
.video-dialog h2 { font-size: 17px; margin: 0 34px 12px 0; }
.video-dialog video {
  display: block;
  width: 100%;
  max-height: 70vh;
  border-radius: 9px;
  background: #000;
}
.video-close {
  position: absolute;
  margin: -2px 0 0 -38px;
  width: 30px;
  height: 30px;
  border: 0;
  border-radius: 50%;
  background: #292929;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
}

.empty {
  text-align: center;
  padding: 50px 20px;
  color: #555;
  font-size: 14px;
}

.history-item {
  background: #141414; border: 1px solid #1f1f1f; border-radius: 12px;
  padding: 12px 14px; margin-bottom: 8px;
}
.history-item .h-date { font-size: 11px; color: #f5a623; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;}
.history-item .h-title { font-size: 15px; font-weight: 600; margin-top: 2px; }
.history-item .h-meta { font-size: 12px; color: #888; margin-top: 3px; }

.kv-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px;
  background: #141414;
  border: 1px solid #1f1f1f;
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.kv-row .l { font-size: 15px; }
.kv-row .r { font-size: 14px; color: #888; }

.note {
  font-size: 12px; color: #666;
  padding: 12px 16px; background: #0f0f0f; border-radius: 10px;
  border-left: 2px solid #f5a623;
  margin-top: 12px;
}

.back-btn {
  background: none; border: none; color: #f5a623;
  font-size: 15px; padding: 4px 0; cursor: pointer;
  font-family: inherit; font-weight: 500;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 4px;
}

.complete-bar {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 448px;
  z-index: 15;
  padding: 0 16px;
}
.complete-bar .btn-primary { width: 100%; padding: 14px; font-size: 16px; box-shadow: 0 6px 20px rgba(245,166,35,0.3);}

@media (max-width: 360px) {
  header h1 { font-size: 20px; }
  .week-strip { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>

<div id="app">
  <header>

  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-tab="plan" class="active"><span class="ico">▦</span><span>Plan</span></button>

    <button data-tab="history"><span class="ico">◷</span><span>History</span></button>
    <button data-tab="more"><span class="ico">⚙</span><span>More</span></button>
  </nav>
</div>
<div class="video-modal" id="video-modal" hidden>
  <div class="video-dialog" role="dialog" aria-modal="true" aria-labelledby="video-title">
    <button class="video-close" id="video-close" aria-label="Close video">×</button>
    <h2 id="video-title"></h2>
    <video id="video-player" controls playsinline preload="metadata"></video>
  </div>
</div>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('trainer-data').textContent);
  const STORAGE_KEY = 'trainer_pwa_v1_state';
  const APP_TITLE = 'Trainer';
  const APP_SUBTITLE = '12 Week Plan';

  // --- State management ---
  let state = loadState();

  function loadState(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return {
      completedDays: {},   // key: "w<week>|<day>" -> {date, completedItems: [pKey...], totalItems: n}
      sessionChecks: {},   // key: same -> [pKey...] (unsaved)
      currentWeek: 1,
      currentTab: 'plan'
    };
  }

  function saveState(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  }

  // --- Helpers ---
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const exerciseKey = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  const findVideo = title => {
    const key = exerciseKey(title);
    const exercise = DATA.exercises.find(e => exerciseKey(e.name) === key);
    return exercise && exercise.video ? exercise.video : null;
  };
  const todayStr = () => new Date().toLocaleDateString('en-CA');
  const dayKey = (week, day) => `w${week}|${day}`;
  const isRestDay = (day) => /rest/i.test(day);

  function getDayItems(week, day) {
    const w = DATA.plan[String(week)];
    if (!w) return [];
    return w[day] || [];
  }

  function openVideo(title, video) {
    const modal = $('#video-modal');
    const player = $('#video-player');
    $('#video-title').textContent = title;
    player.src = `videos/${encodeURIComponent(video)}`;
    modal.hidden = false;
    player.play().catch(() => {});
  }

  function closeVideo() {
    const player = $('#video-player');
    player.pause();
    player.removeAttribute('src');
    player.load();
    $('#video-modal').hidden = true;
  }

  $('#video-close').addEventListener('click', closeVideo);
  $('#video-modal').addEventListener('click', e => {
    if (e.target.id === 'video-modal') closeVideo();
  });

  function isDayComplete(week, day) {
    const items = getDayItems(week, day);
    if (items.length === 0) return false;
    if (isRestDay(day)) return !!state.completedDays[dayKey(week,day)];
    const k = dayKey(week, day);
    const rec = state.completedDays[k];
    if (!rec) return false;
    return rec.completedItems && rec.completedItems.length === items.length;
  }

  function isDayPartial(week, day) {
    const k = dayKey(week, day);
    const rec = state.completedDays[k];
    if (rec) return false; // already completed
    const checks = state.sessionChecks[k];
    return checks && checks.length > 0;
  }

  function isWeekDone(week) {
    const w = DATA.plan[String(week)];
    if (!w) return false;
    const days = DATA.dayOrder[String(week)];
    return days.every(d => isDayComplete(week, d));
  }

  // --- Tab handling ---
  $$('.tabbar button').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentTab = btn.dataset.tab;
      $$('.tabbar button').forEach(b => b.classList.toggle('active', b === btn));
      saveState();
      currentDayView = null;
      render();
    });
  });

  let currentDayView = null;  // {week, day} when viewing a workout
  let currentExerciseFilter = null;

  function setHeader(title, sub){
    $('#hdr-title').textContent = title || APP_TITLE;
    $('#hdr-sub').textContent = sub || APP_SUBTITLE;
  }

  // --- Renderers ---
  function render(){
    if (currentDayView) return renderWorkout();
    switch(state.currentTab){
      case 'plan': return renderPlan();
      case 'exercises': return renderExercises();
      case 'history': return renderHistory();
      case 'more': return renderMore();
    }
  }

  function renderPlan(){
    setHeader(APP_TITLE, APP_SUBTITLE);
    const main = $('#main');
    const week = state.currentWeek;
    
    let html = '<div class="section-title">Select week</div>';
    html += '<div class="week-strip">';
    for (let w = 1; w <= 12; w++) {
      const isActive = w === week;
      const isDone = isWeekDone(w);
      html += `<div class="week-chip ${isActive?'active':''} ${isDone?'done':''}" data-week="${w}"><span class="num">${w}</span>WEEK</div>`;
    }
    html += '</div>';

    html += `<div class="section-title">Week ${week}</div>`;
    const days = DATA.dayOrder[String(week)] || [];
    days.forEach(d => {
      const items = getDayItems(week, d);
      const done = isDayComplete(week, d);
      const partial = isDayPartial(week, d);
      const rest = isRestDay(d);
      const dayNum = d.match(/Day (\d+)/);
      const badgeText = dayNum ? dayNum[1] : '?';
      let metaText;
      if (rest) metaText = 'Rest day';
      else if (done) metaText = `Completed · ${items.length} items`;
      else if (partial) {
        const checked = (state.sessionChecks[dayKey(week,d)] || []).length;
        metaText = `${checked} / ${items.length} done`;
      } else metaText = `${items.length} items`;
      html += `<div class="card tappable day-card ${done?'done':''} ${rest?'rest':''}" data-day="${esc(d)}">
        <div class="day-badge">${badgeText}</div>
        <div class="day-info">
          <div class="t">${esc(d.replace(/^Day \d+: /,''))}</div>
          <div class="m">${metaText}</div>
        </div>
        <div class="chev">›</div>
      </div>`;
    });

    main.innerHTML = html;

    $$('.week-chip').forEach(c => c.addEventListener('click', () => {
      state.currentWeek = parseInt(c.dataset.week);
      saveState();
      render();
    }));
    $$('.day-card').forEach(c => c.addEventListener('click', () => {
      currentDayView = { week, day: c.dataset.day };
      render();
    }));
  }

  function renderWorkout(){
    const { week, day } = currentDayView;
    const items = getDayItems(week, day);
    const k = dayKey(week, day);
    const completedRec = state.completedDays[k];
    const sessionChecks = new Set(state.sessionChecks[k] || []);
    const isCompletedAlready = !!completedRec;

    if (isCompletedAlready) {
      completedRec.completedItems.forEach(p => sessionChecks.add(p));
    }

    setHeader(day.replace(/^Day \d+: /,''), `Week ${week} · Day ${day.match(/\d+/)?.[0] || ''}`);
    const main = $('#main');

    let html = `<button class="back-btn" id="back">← Back to plan</button>`;

    if (isRestDay(day) && items.length === 1 && items[0].title === '') {
      // pure rest day
      html += `<div class="card" style="text-align:center; padding:30px 20px;">
        <div style="font-size:48px;">○</div>
        <div style="font-size:18px; font-weight:600; margin:12px 0 6px;">Rest day</div>
        <div style="color:#888; font-size:14px;">Recovery is part of the program.</div>
      </div>`;
      if (!isCompletedAlready) {
        html += `<button class="btn btn-primary" id="rest-complete" style="width:100%; margin-top:10px;">Mark rest day done</button>`;
      } else {
        html += `<div class="note">Marked complete on ${esc(completedRec.date)}.<br><br><button class="btn btn-danger" id="undo-complete" style="margin-top:8px;">Undo completion</button></div>`;
      }
    } else {
      const checkedCount = items.filter(i => sessionChecks.has(i.pKey)).length;
      const pct = items.length ? Math.round(checkedCount/items.length*100) : 0;

      html += `<div class="progress-text"><span>${checkedCount} / ${items.length} done</span><span>${pct}%</span></div>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>`;

      items.forEach(it => {
        const checked = sessionChecks.has(it.pKey);
        let body = `<div class="ex-title">${esc(it.title || '(unnamed)')}</div>`;
        if (it.line1) body += `<div class="ex-line">${esc(it.line1)}</div>`;
        if (it.line2) body += `<div class="ex-line">${esc(it.line2)}</div>`;
        const video = findVideo(it.title);
        const videoButton = video ? `<button class="video-btn" data-video="${esc(video)}" data-title="${esc(it.title)}">Video</button>` : '';
        html += `<div class="exercise-row ${checked?'done':''}" data-pkey="${it.pKey}">
          <div class="checkbox ${checked?'checked':''}"></div>
          <div class="ex-body">${body}</div>${videoButton}
        </div>`;
      });

      if (!isCompletedAlready) {
        html += `<div style="height:80px;"></div>`;
        html += `<div class="complete-bar"><button class="btn btn-primary" id="complete-day">Mark day complete</button></div>`;
      } else {
        html += `<div class="note">Completed on ${esc(completedRec.date)}.<br>${completedRec.completedItems.length} of ${completedRec.totalItems} items checked.<br><br><button class="btn btn-danger" id="undo-complete">Undo completion</button></div>`;
      }
    }

    main.innerHTML = html;

    $('#back').addEventListener('click', () => { currentDayView = null; render(); });

    $$('.exercise-row').forEach(row => {
      const videoButton = row.querySelector('.video-btn');
      if (videoButton) {
        videoButton.addEventListener('click', e => {
          e.stopPropagation();
          openVideo(videoButton.dataset.title, videoButton.dataset.video);
        });
      }
      if (isCompletedAlready) return;
      row.addEventListener('click', () => {
        const pKey = parseInt(row.dataset.pkey);
        const arr = state.sessionChecks[k] || [];
        const idx = arr.indexOf(pKey);
        if (idx >= 0) arr.splice(idx,1); else arr.push(pKey);
        state.sessionChecks[k] = arr;
        saveState();
        renderWorkout();
      });
    });

    const cd = $('#complete-day');
    if (cd) cd.addEventListener('click', () => {
      const checks = state.sessionChecks[k] || [];
      if (checks.length === 0 && !confirm('No items checked. Mark complete anyway?')) return;
      state.completedDays[k] = {
        date: todayStr(),
        completedItems: [...checks],
        totalItems: items.length
      };
      delete state.sessionChecks[k];
      saveState();
      currentDayView = null;
      render();
    });

    const rc = $('#rest-complete');
    if (rc) rc.addEventListener('click', () => {
      state.completedDays[k] = { date: todayStr(), completedItems:[items[0].pKey], totalItems: 1 };
      delete state.sessionChecks[k];
      saveState();
      currentDayView = null;
      render();
    });

    const uc = $('#undo-complete');
    if (uc) uc.addEventListener('click', () => {
      if (!confirm('Undo completion for this day?')) return;
      delete state.completedDays[k];
      saveState();
      renderWorkout();
    });
  }

  function renderExercises(){
    setHeader('Exercises', `${DATA.exercises.length} total`);
    const main = $('#main');
    let html = '';
    DATA.muscles.forEach(m => {
      const list = DATA.exercises.filter(e => e.muscleId === m.id);
      if (!list.length) return;
      html += `<div class="muscle-group">
        <div class="muscle-name">${esc(m.name)} · ${list.length}</div>
        <div class="muscle-list">`;
      list.forEach(ex => {
        html += `<div class="ex-item"><span class="ex-name">${esc(ex.name)}</span><button class="video-btn" data-video="${esc(ex.video || '')}" data-title="${esc(ex.name)}" ${ex.video ? '' : 'hidden'}>Video</button></div>`;
      });
      html += `</div></div>`;
    });
    // Show exercises that don't have a muscle id
    const orphans = DATA.exercises.filter(e => !e.muscleId);
    if (orphans.length) {
      html += `<div class="muscle-group">
        <div class="muscle-name">Other · ${orphans.length}</div>
        <div class="muscle-list">`;
      orphans.forEach(ex => {
        html += `<div class="ex-item"><span class="ex-name">${esc(ex.name)} <span style="color:#666;font-size:12px;">(${esc(ex.category||'')})</span></span><button class="video-btn" data-video="${esc(ex.video || '')}" data-title="${esc(ex.name)}" ${ex.video ? '' : 'hidden'}>Video</button></div>`;
      });
      html += `</div></div>`;
    }
    main.innerHTML = html;
    $$('.video-btn').forEach(button => button.addEventListener('click', () => {
      openVideo(button.dataset.title, button.dataset.video);
    }));
  }

  function renderHistory(){
    const entries = Object.entries(state.completedDays).map(([k,v]) => {
      const m = k.match(/^w(\d+)\|(.+)$/);
      return { week: parseInt(m[1]), day: m[2], ...v, key: k };
    });
    setHeader('History', `${entries.length} day${entries.length===1?'':'s'} completed`);
    const main = $('#main');
    if (!entries.length) {
      main.innerHTML = '<div class="empty">No completed days yet.<br>Complete a workout to see it here.</div>';
      return;
    }
    entries.sort((a,b) => (b.date+b.key).localeCompare(a.date+a.key));
    let html = '';
    entries.forEach(e => {
      html += `<div class="history-item">
        <div class="h-date">${esc(e.date)}</div>
        <div class="h-title">Week ${e.week} · ${esc(e.day.replace(/^Day \d+: /,''))}</div>
        <div class="h-meta">${e.completedItems.length} / ${e.totalItems} item${e.totalItems===1?'':'s'} checked</div>
      </div>`;
    });
    main.innerHTML = html;
  }

  function renderMore(){
    setHeader('More', 'Settings & data');
    const totalDays = Object.keys(state.completedDays).length;
    const main = $('#main');
    main.innerHTML = `
      <div class="section-title">Progress</div>
      <div class="card">
        <div class="row-title">${totalDays} / 84 days completed</div>
        <div class="progress-bar"><div style="width:${Math.min(100, totalDays/84*100).toFixed(1)}%"></div></div>
        <div class="row-meta">${(totalDays/84*100).toFixed(1)}% of the 12-week plan</div>
      </div>

      <div class="section-title">Data</div>
      <div class="kv-row" id="export-btn"><span class="l">Export progress</span><span class="r">JSON ›</span></div>
      <div class="kv-row" id="import-btn"><span class="l">Import progress</span><span class="r">JSON ›</span></div>
      <div class="kv-row" id="reset-btn" style="border-color:#3a1f1f; background:#1a0f0f;"><span class="l" style="color:#ff6b6b;">Reset all progress</span><span class="r" style="color:#ff6b6b;">›</span></div>

      <div class="section-title">Install</div>
      <div class="note">To use as an app on iPhone: open this page in Safari, tap the <strong>Share</strong> button, then <strong>Add to Home Screen</strong>. The icon will appear on your home screen and open like a native app.</div>

      <div class="section-title">About</div>
      <div class="card">
        <div class="row-title">Trainer · 12 Week Plan</div>
        <div class="row-meta">Personal use only. Workout content is the property of its original creator. Data stored locally on this device.</div>
      </div>
    `;

    $('#export-btn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `trainer-progress-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    $('#import-btn').addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = ev => {
          try {
            const d = JSON.parse(ev.target.result);
            if (d && typeof d === 'object' && d.completedDays) {
              if (!confirm('Replace current progress with imported data?')) return;
              state = Object.assign({completedDays:{}, sessionChecks:{}, currentWeek:1, currentTab:'more'}, d);
              saveState();
              render();
              alert('Imported successfully.');
            } else alert('That doesn\'t look like a Trainer progress file.');
          } catch(err) { alert('Could not read file: ' + err.message); }
        };
        r.readAsText(f);
      };
      inp.click();
    });

    $('#reset-btn').addEventListener('click', () => {
      if (!confirm('Reset ALL progress? This cannot be undone.')) return;
      if (!confirm('Really reset everything? Export first if you want a backup.')) return;
      state = { completedDays:{}, sessionChecks:{}, currentWeek:1, currentTab:'more' };
      saveState();
      render();
    });
  }

  // initial tab state
  $$('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.currentTab));
  render();
})();
</script>
</body>
</html>
